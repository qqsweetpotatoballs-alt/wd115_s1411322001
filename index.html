<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>主頁</title>
  <style>
    :root {
      --bg: #f5f5f4;
      --card: #ffffff;
      --text: #1c1917;
      --muted: #78716c;
      --accent: #2563eb;
      --accent-hover: #1d4ed8;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #1c1917;
        --card: #292524;
        --text: #f5f5f4;
        --muted: #a8a29e;
        --accent: #3b82f6;
        --accent-hover: #60a5fa;
      }
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, "Noto Sans TC", "Microsoft JhengHei", sans-serif;
    }
    .card {
      width: 100%;
      max-width: 420px;
      background: var(--card);
      border-radius: 16px;
      padding: 40px 28px;
      text-align: center;
      box-shadow: 0 4px 24px rgba(0, 0, 0, 0.08);
    }
    h1 { font-size: 1.8rem; margin-bottom: 8px; }
    p { color: var(--muted); margin-bottom: 32px; }
    nav { display: flex; flex-direction: column; gap: 14px; }
    .btn {
      display: block;
      padding: 14px 20px;
      border-radius: 10px;
      background: var(--accent);
      color: #fff;
      text-decoration: none;
      font-size: 1.05rem;
      font-weight: 600;
      transition: background 0.2s, transform 0.1s;
    }
    .btn:hover { background: var(--accent-hover); }
    .btn:active { transform: scale(0.98); }
  </style>
</head>
<body>
  <main class="card">
    <h1>歡迎</h1>
    <p>請選擇要前往的頁面</p>
    <nav>
      <a class="btn" href="index1.html">頁面一</a>
      <a class="btn" href="index2.html">頁面二</a>
    </nav>
  </main>
</body>
</html>
